[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillgap-backend"
version = "0.1.0"
description = "Career assessment and evidence-based skill gap API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "email-validator>=2.2,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<26",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
skillgap-data = "training.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "training"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
